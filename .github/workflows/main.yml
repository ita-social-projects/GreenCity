# This is a basic workflow to help you get started with Actions

name: CI/CD GreenCity
# Controls when the action will run.

concurrency: Testing

on:
  # Triggers the workflow on push or pull request events but only for the dev branch
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  repository: greencity
  userRepoName: core
  onbootJarName: app.jar
  dockerRepoName: skyere/greencity

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21
      
#       - name: Set up Go
#         uses: actions/setup-go@v3
#         with:
#           go-version: 1.18

      - name: Run a multi-line script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          git fetch --unshallow
          mvn clean install sonar:sonar \
            -Dsonar.projectKey=ita-social-projects-green-city \
            -Dsonar.organization=ita-social-projects \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.exclusions=**/config/*,**/entity/*,**/entity/**,**/exceptions/*,**/exception/*,**/SearchCriteria.java,**/EcoNewsSearchRepo.java,**/EventSearchRepoImpl.java,**/DatabaseBackupServiceImpl.java,**/HabitTranslationFilter.java,**/CustomNotificationRepoImpl.java,**/PlaceFilter.java,**/PlaceSearchRepoImpl.java,**/EcoNewsSearchRepoImpl.java,**/enums/**,**/enums/*,**/constant/**,**/constant/*


      - name: Test Reporter
        #v1.5.0
        uses: dorny/test-reporter@0d00bb14cb0cc2c9b8985df6e81dd333188224e1
        if: success() || failure()
        with:
          name: Tests Report
          path: ${{ env.userRepoName }}/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Rename user jar to app
        run: mv $userRepoName/target/*.jar $userRepoName/target/$onbootJarName

      - name: Set outputs
        run: echo "GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Docker Login
        #v2.0.0
        uses: docker/login-action@49ed152c8eca782a232dede0303416e8f356c37b
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker images
        #v3.0.0
        uses: docker/build-push-action@e551b19e49efd4e98792db7592c17c09b89db8d8
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.dockerRepoName }}:test-${{ env.GITHUB_SHA_SHORT }}

#       - name: Kubernetes Set Context
#         uses: Azure/k8s-set-context@v3.0
#         with:
#           kubeconfig: ${{ secrets.KUBE_CONFIG }}
      
#       - name: Set up Postgres
#         run: kubectl scale deploy postgres --replicas=1 -n test
      
#       - name: Kubernetes tests
#         run: |
#           cd chart-test
#           go test -v ./...
      
#       - name: Post Set up Postgres
#         if: success() || failure()
#         run: kubectl scale deploy postgres --replicas=0 -n test

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Deploy 🚀
        if: ${{ github.event_name == 'push' }}
        #v3.7.1
        uses: JamesIves/github-pages-deploy-action@132898c54c57c7cc6b80eb3a89968de8fc283505
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: .
          CLEAN: true 
